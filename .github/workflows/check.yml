name: Desktop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: macOS installer regression tests
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s scripts/tests -v
      - run: npx tauri build --no-bundle
      - name: Install Windows browser
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Install Chromium and WebKit
        if: runner.os != 'Windows'
        run: npx playwright install --with-deps chromium webkit
      - name: Browser regression tests
        run: npm run test:ui
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
      - name: Upload desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: feather-${{ matrix.os }}
          path: |
            target/release/feather-desktop
            target/release/feather-desktop.exe
          if-no-files-found: error
