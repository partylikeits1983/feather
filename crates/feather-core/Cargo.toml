[package]
name = "feather-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tempfile = "3"
notify = "8"
blake3 = "1"
trash = "5"
base64 = "0.22"
wait-timeout = "0.2"

[dev-dependencies]
serde_json = "1"

[[bench]]
name = "filesystem"
harness = false
