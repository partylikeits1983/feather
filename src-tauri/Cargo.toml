[package]
name = "feather-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "feather-desktop"

[lib]
name = "feather_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
feather-core = { path = "../crates/feather-core" }
serde = { version = "1", features = ["derive"] }
portable-pty = "0.9"
base64 = "0.22"
tempfile = "3"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPrintInfo", "NSPrintOperation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSDictionary", "NSGeometry", "NSURL"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView", "objc2-app-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "=2.0.2"

[dev-dependencies]
serde_json = "1"
